<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Subtle 3D Shadow -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Dark Charcoal Background -->
  <rect width="64" height="64" rx="14" fill="#0f1115"/>

  <!-- RM Text with Shadow -->
  <text x="32" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" text-anchor="middle" filter="url(#shadow3d)">
    <tspan fill="#FFFFFF">R</tspan><tspan fill="#FF6B00">M</tspan>
  </text>
</svg>
